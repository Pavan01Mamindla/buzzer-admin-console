<header class="header">

  <div class="header-left">

    <div class="mobile-brand">
      <div class="mobile-brand-mark">B</div>
      <span>BUZZER</span>
    </div>

    <div class="title">
      BUZZER ADMIN CONSOLE
    </div>

  </div>

  <div class="header-right">

    <div class="search">

      <span class="search-icon">⌕</span>

      <input
        type="search"
        placeholder="Search..."
        aria-label="Search"
      />

      <span class="search-shortcut">⌘ K</span>

    </div>

    <div class="user">

      <div class="avatar">
        {{ userEmail.charAt(0).toUpperCase() }}
      </div>

      <div class="user-info">
        <strong>Admin</strong>
        <small>{{ userEmail }}</small>
      </div>

    </div>

    <button
      class="signout"
      type="button"
      (click)="logout()"
    >
      Sign out
    </button>

  </div>

</header>
