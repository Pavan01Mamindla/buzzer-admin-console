<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar__top">
    <div class="brand" *ngIf="!collapsed()">
      <div class="brand__mark">B</div>
      <div class="brand__text">
        <span class="brand__name">Buzzer</span>
        <span class="brand__sub">Admin Console</span>
      </div>
    </div>
    <div class="brand__mark" *ngIf="collapsed()">B</div>
    <button class="collapse-btn" type="button" (click)="toggleSidebar()" [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <app-icon [name]="collapsed() ? 'chevronRight' : 'chevronLeft'" [size]="16" />
    </button>
  </div>

  <nav class="nav">
    <div class="nav__group" *ngFor="let group of groups()">
      <button class="nav__group-label" type="button" (click)="toggleGroup(group)" *ngIf="!collapsed()">
        <span>{{ group.label }}</span>
        <app-icon name="chevronDown" [size]="14" [style.transform]="group.expanded ? 'rotate(0deg)' : 'rotate(-90deg)'" />
      </button>

      <ul class="nav__items" *ngIf="group.expanded || collapsed()">
        <li *ngFor="let item of group.items">
          <a
            *ngIf="item.route && !item.comingSoon; else disabledItem"
            class="nav__item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            <app-icon [name]="item.icon" [size]="18" />
            <span *ngIf="!collapsed()">{{ item.label }}</span>
          </a>
          <ng-template #disabledItem>
            <span class="nav__item nav__item--disabled" [title]="item.comingSoon ? 'Coming soon' : ''">
              <app-icon [name]="item.icon" [size]="18" />
              <span *ngIf="!collapsed()">{{ item.label }}</span>
              <span class="soon-pill" *ngIf="!collapsed() && item.comingSoon">Soon</span>
            </span>
          </ng-template>
        </li>
      </ul>
    </div>
  </nav>

  <div class="sidebar__footer">
    <div class="user">
      <div class="user__avatar">{{ initials() }}</div>
      <div class="user__meta" *ngIf="!collapsed()">
        <span class="user__email">{{ user?.email || 'admin@buzzerfan.com' }}</span>
        <button class="user__signout" type="button" (click)="signOut()">Sign out</button>
      </div>
    </div>
  </div>
</aside>
